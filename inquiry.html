<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Inquiry</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="container">

        <header>
            <div class="logo">
                <img src="images/logo-nav.png" alt="Cannons coffee logo">
                <h1>Cannons Coffee</h1>
            </div>

            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="latte.html">Coffee</a></li>
                    <li><a href="https://www.starbucks.com" target="_blank">About</a></li>
                    <li><a href="mailto:escarletmaca@gmail.com" target="_blank">Contact</a></li>
                    <li><a href="inquiry.html">Inquiry</a></li>
                    <li><a href="login.html">Login</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <h2>Customer Form</h2>
            <form id="inquiry-form">

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <br>
                <br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br>
                <br>
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>
                <br>
                <br>
                <label for="comments">Comments:</label>
                <textarea id="comments" name="comments"></textarea>
                <br>
                <br>
                <label for="coffee-flavor">Favorite Flavor of Coffee is..</label>
                <select id="coffee-flavor" name="coffee-flavor">
                    <option value="vanilla">Vanilla</option>
                    <option value="caramel">Caramel</option>
                    <option value="mocha">Mocha</option>
                    <option value="hazelnut">Hazelnut</option>
                </select>
                <br>
                <br>
                <p>What are you interested in?</p>

                <input type="radio" id="buy-coffee" name="interest" value="buying coffee">
                <label for="buy-coffee">Buying Coffee</label>
                <br>
                <input type="radio" id="employment" name="interest" value="seeking employment">
                <label for="employment">Seeking Employment</label>
                <br>
                <br>
                <button type="submit">Submit</button>
            </form>
            <div id="thank-you-message"></div>
        </main>

        <footer>
            <img src="images/logo-footer.png" alt="Beans of Joy! Est. 2014">
            <p>&copy; 2026 Cannons Coffee. All Rights Reserved.</p>
        </footer>

    </div>

    <script src="js/custom-inquiry.js"></script>

</body>

</html>
